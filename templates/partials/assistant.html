{# Client-care AI assistant: on every page #}
<div class="concierge" data-concierge data-starters='{{ assistant_starters|default_if_none:""|join:"|" }}'>
  <button class="concierge-toggle" type="button" aria-expanded="false" aria-controls="concierge-panel">
    <span>Client care</span>
  </button>
  <section class="concierge-panel" id="concierge-panel" role="dialog" aria-label="Client care assistant" hidden>
    <header class="concierge-head">
      <div>
        <p class="eyebrow">Client care · <span style="color:var(--accent)">online</span></p>
        <p class="concierge-title">How may we help?</p>
      </div>
      <button type="button" data-concierge-close aria-label="Close">Close</button>
    </header>
    <div class="concierge-log" aria-live="polite">
      <div class="cmsg ai"><p>Bonjour. Ask me about orders, delivery, returns, our pieces, or any error code you see. If I can't answer, I'll open a request for our advisors.</p></div>
    </div>
    <div class="concierge-chips"></div>
    <form class="concierge-form" autocomplete="off">
      <input type="text" maxlength="500" placeholder="Ask a question…" aria-label="Ask the assistant">
      <button type="submit">Send</button>
    </form>
  </section>
</div>
