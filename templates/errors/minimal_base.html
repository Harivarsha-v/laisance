{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ BRAND_NAME }}{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  <header class="header header--solid" style="grid-template-columns:1fr">
    <a href="/" class="wordmark" style="justify-self:center">{{ BRAND_NAME }}<small>Paris</small></a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
